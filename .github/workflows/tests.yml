name: Tests
on: [push, pull_request]
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,ui]" yara-python
      - run: python -m pytest -q
      - run: >-
          netsentinel analyze data/demo.pcap --offline --format json
          --report-md artifacts/report.md --report-html artifacts/report.html
          --mitre-layer artifacts/attack-layer.json
